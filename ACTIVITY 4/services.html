<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#559fe0">
    <title>Zymond Is Smart</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0 24px 24px;
            background: linear-gradient(135deg, #d9f0ff 0%, #8fc9f4 48%, #559fe0 100%);
            color: #173b5a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 74px;
            margin: 0 -24px;
            padding: 0 max(24px, calc((100vw - 1120px) / 2));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            background: linear-gradient(105deg, #eaf8ff 0%, #c8eaff 55%, #b6ddfb 100%);
            box-shadow: 0 4px 18px rgb(24 76 120 / 12%);
        }

        .brand {
            color: #174d78;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            white-space: nowrap;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-menu a {
            padding: 10px 0;
            color: #315a78;
            font-size: 0.93rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-menu a:hover,
        .nav-menu a:focus-visible {
            color: #0873be;
        }

        main {
            width: min(100%, 620px);
            margin: 90px auto 24px;
            padding: clamp(36px, 8vw, 72px) 28px;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 24px;
            background: rgb(255 255 255 / 78%);
            box-shadow: 0 20px 55px rgb(24 76 120 / 18%);
            text-align: center;
        }

        p {
            margin: 0 0 16px;
            color: #347eb5;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #174d78;
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            line-height: 1.1;
        }

        .contact-info {
            margin: 28px 0 0;
            padding-top: 22px;
            border-top: 1px solid rgb(52 126 181 / 22%);
            color: #526e87;
            font-size: 1rem;
            line-height: 1.6;
        }

        .contact-info strong {
            display: block;
            margin-bottom: 6px;
            color: #20577e;
            font-size: 1.05rem;
        }

        .phone-number {
            display: inline-block;
            margin-top: 4px;
            color: #174d78;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .sample-note {
            display: block;
            margin-top: 4px;
            color: #718399;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 0 16px 24px;
            }

            .navbar {
                margin: 0 -16px;
                padding: 16px 20px;
                flex-wrap: wrap;
                gap: 14px;
            }

            .nav-menu {
                width: 100%;
                justify-content: space-between;
                gap: 14px;
            }

            .nav-menu a {
                font-size: 0.88rem;
            }

            main {
                margin-top: 36px;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="home.html" aria-label="MathSpace home">MathSpace</a>
        <nav class="nav-menu" aria-label="Main menu">
            <a href="home.html">Home</a>
            <a href="blogs.html">Blogs</a>
            <a href="services.html" aria-current="page">Services</a>
        </nav>
    </header>
    <main>
        <p>A little reminder</p>
        <h1>Zymond is smart</h1>
        <div class="contact-info">
            <strong>Please contact our services</strong>
            Call us at:
            <span class="phone-number">+63 900 000 0000</span>
            <span class="sample-note">Sample number only — not a real contact number.</span>
        </div>
    </main>
</body>
</html>
